# Pages CMS configuration - edit the site at https://app.pagescms.org
# Content lives in content/*.yml; uploaded pictures go to uploads/.
media:
  input: uploads
  output: uploads
components:
  hero:
    type: object
    label: Top banner
    fields:
      - name: style
        label: Style
        type: select
        options:
          values:
            - page
            - home
      - name: eyebrow
        label: Small heading (home only)
        type: string
      - name: crumbs
        label: Breadcrumb
        type: string
        description: e.g. Classes / Art forms
      - name: title
        label: Big title
        type: string
        description: Put *asterisks* around words to show them in italic colour.
      - name: lede
        label: Intro sentence
        type: text
      - name: image
        label: Photo
        type: image
        description: Upload your own photo here. If left empty, a decorative illustration is shown instead.
      - name: art
        label: Illustration (used only when there is no photo)
        type: select
        options:
          values:
            - abstract
            - landscape
            - still
            - madhubani
            - mandala
            - lippan
            - watercolor
            - texture
            - diya
            - ganesha
      - name: art_seed
        label: Illustration variation
        type: number
        description: Any number — changes the look of the illustration.
      - name: seal_label
        label: Round badge — small text (home only)
        type: string
      - name: seal_text
        label: Round badge — main text (home only)
        type: string
      - name: buttons
        label: Buttons
        type: object
        list: true
        fields:
          - name: label
            label: Button text
            type: string
          - name: link
            label: Link
            type: string
            description: A page name like "classes" or "register", or a full web address.
          - name: style
            label: Style
            type: select
            options:
              values:
                - solid
                - outline
                - link
  sections:
    type: object
    list: true
    label: Page sections
    description: Each block of the page, top to bottom. You can add, remove and reorder sections.
    fields:
      - name: layout
        label: Section type
        type: select
        options:
          values:
            - columns
            - facts
            - cards
            - numbers
            - features
            - prices
            - timeline
            - awards
            - gallery
            - quote
            - cta
            - notice
            - marquee
        description: columns = text and/or picture side by side · facts = fact strip · cards = grid of cards · numbers / features = icon-style grid · prices = price list · timeline · awards · gallery · quote · cta = call-to-action band · notice = highlighted note · marquee = scrolling words
      - name: tint
        label: Background
        type: select
        options:
          values:
            - none
            - tint
            - dark
      - name: eyebrow
        label: Small heading above
        type: string
      - name: heading
        label: Heading
        type: string
        description: Put *asterisks* around words to show them in italic colour.
      - name: intro
        label: Intro text
        type: text
      - name: blocks
        label: Columns (for "columns")
        type: object
        list: true
        fields:
          - name: eyebrow
            label: Small heading above
            type: string
            description: Short uppercase label.
          - name: heading
            label: Heading
            type: string
            description: Put *asterisks* around words to show them in italic colour.
          - name: body
            label: Text
            type: text
            description: Blank line = new paragraph. *italic*, **bold**, [link text](address). "### Title" makes a small heading and "- item" a bullet list.
          - name: list
            label: Checklist
            type: object
            list: true
            fields:
              - name: title
                label: Bold lead-in (optional)
                type: string
              - name: text
                label: Text
                type: string
          - name: prices
            label: Prices / rows
            type: object
            list: true
            fields:
              - name: title
                label: Title
                type: string
              - name: note
                label: Details
                type: text
              - name: amount
                label: Amount
                type: string
                description: e.g. $250
              - name: unit
                label: Unit
                type: string
                description: e.g. / week
              - name: link_label
                label: Link text (instead of amount)
                type: string
              - name: link
                label: Link
                type: string
          - name: schedule
            label: Schedule
            type: object
            list: true
            fields:
              - name: label
                label: Place / label
                type: string
              - name: text
                label: Dates & time
                type: string
          - name: chips
            label: Tags
            type: string
            list: true
          - name: footnote
            label: Small print
            type: string
          - name: button_label
            label: Button text
            type: string
          - name: button_link
            label: Button link
            type: string
          - name: button_style
            label: Button style
            type: select
            options:
              values:
                - solid
                - outline
                - link
          - name: form
            label: Show a form here
            type: select
            options:
              values:
                - none
                - contact
                - register
          - name: image
            label: Photo
            type: image
            description: Upload your own photo here. If left empty, a decorative illustration is shown instead.
          - name: art
            label: Illustration (used only when there is no photo)
            type: select
            options:
              values:
                - abstract
                - landscape
                - still
                - madhubani
                - mandala
                - lippan
                - watercolor
                - texture
                - diya
                - ganesha
          - name: art_seed
            label: Illustration variation
            type: number
            description: Any number — changes the look of the illustration.
          - name: caption
            label: Photo description (for accessibility)
            type: string
        description: Add one or two columns. A column with only a photo/illustration shows the picture.
      - name: facts
        label: Facts (for "facts")
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: value
            label: Value
            type: string
      - name: cards
        label: Cards (for "cards")
        type: object
        list: true
        fields:
          - name: kicker
            label: Small label
            type: string
          - name: title
            label: Title
            type: string
          - name: text
            label: Text
            type: text
          - name: link
            label: Link to page
            type: string
          - name: image
            label: Photo
            type: image
            description: Upload your own photo here. If left empty, a decorative illustration is shown instead.
          - name: art
            label: Illustration (used only when there is no photo)
            type: select
            options:
              values:
                - abstract
                - landscape
                - still
                - madhubani
                - mandala
                - lippan
                - watercolor
                - texture
                - diya
                - ganesha
          - name: art_seed
            label: Illustration variation
            type: number
            description: Any number — changes the look of the illustration.
      - name: columns
        label: Cards per row (for "cards")
        type: select
        options:
          values:
            - '3'
            - '4'
      - name: stats
        label: Statistics row (for "cards")
        type: object
        list: true
        fields:
          - name: number
            label: Number
            type: string
          - name: label
            label: Label
            type: string
      - name: numbers
        label: Items (for "numbers")
        type: object
        list: true
        fields:
          - name: number
            label: Big number
            type: string
          - name: title
            label: Title
            type: string
          - name: text
            label: Text
            type: text
      - name: features
        label: Items (for "features")
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: text
            label: Text
            type: text
      - name: prices
        label: Price rows (for "prices")
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: note
            label: Details
            type: text
          - name: amount
            label: Amount
            type: string
          - name: unit
            label: Unit
            type: string
          - name: link_label
            label: Link text
            type: string
          - name: link
            label: Link
            type: string
      - name: footnote
        label: Small print
        type: text
      - name: notice
        label: Highlighted note (for "prices")
        type: text
      - name: timeline
        label: Entries (for "timeline")
        type: object
        list: true
        fields:
          - name: date
            label: Date
            type: string
          - name: title
            label: Title
            type: string
          - name: text
            label: Text
            type: text
      - name: awards
        label: Entries (for "awards")
        type: object
        list: true
        fields:
          - name: year
            label: Year / label
            type: string
          - name: badge
            label: Badge (e.g. 1st place)
            type: string
          - name: title
            label: Title
            type: string
          - name: text
            label: Text
            type: text
      - name: gallery
        label: Pictures (for "gallery")
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: category
            label: Category
            type: string
            description: Used for the filter buttons.
          - name: image
            label: Photo
            type: image
            description: Upload your own photo here. If left empty, a decorative illustration is shown instead.
          - name: art
            label: Illustration (if no photo)
            type: select
            options:
              values:
                - abstract
                - landscape
                - still
                - madhubani
                - mandala
                - lippan
                - watercolor
                - texture
                - diya
                - ganesha
      - name: text
        label: Text (for "quote" and "notice")
        type: text
      - name: cite
        label: Quote by (for "quote")
        type: string
      - name: body
        label: Text (for "cta")
        type: string
      - name: buttons
        label: Buttons (for "cta")
        type: object
        list: true
        fields:
          - name: label
            label: Button text
            type: string
          - name: link
            label: Link
            type: string
            description: A page name like "classes" or "register", or a full web address.
          - name: style
            label: Style
            type: select
            options:
              values:
                - solid
                - outline
                - link
      - name: words
        label: Words (for "marquee")
        type: string
        list: true
      - name: button_label
        label: Link text under cards
        type: string
      - name: button_link
        label: Link under cards
        type: string
