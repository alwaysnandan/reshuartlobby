title: Mixed Media Workshop — The Golden Majesty
description: Beginner-friendly modeling paste and gold leaf texture art workshop in Ashburn and Chantilly, VA.
hero:
  crumbs: Workshops / Mixed media
  title: The Golden *Majesty*
  lede: A beginner-friendly texture-art workshop for adults — modeling paste, acrylics and elegant gold leaf on a large canvas.
