title: Reshu Art Lobby — Art Classes in Chantilly & Ashburn, VA
description: Art classes for kids and adults, workshops, summer camps and paint
  parties in Chantilly and Ashburn, Virginia.
hero:
  style: home
  eyebrow: Chantilly · Ashburn · Online
  title: The quiet joy of *making art*
  lede: An intimate Northern Virginia art studio for children and adults. Learn
    watercolour, acrylic, charcoal and the folk traditions of India — guided
    patiently, one brushstroke at a time.
  image: uploads/cr=w_1620,h_2000.webp
  art: landscape
  art_seed: 4
  seal_label: Now open
  seal_text: Spring ’26 session
  buttons:
    - label: Book a free trial
      link: https://reshuartlobby.brightpanda.app/
    - label: View classes
      link: https://reshuartlobby.brightpanda.app/
      style: outline
sections:
  - layout: marquee
    words:
      - Watercolour
      - Acrylic
      - Charcoal
      - Oil Pastels
      - Madhubani
      - Lippan
      - Mandala
      - Gond
      - Clay
      - Modeling Paste
  - layout: columns
    blocks:
      - art: still
        art_seed: 2
      - eyebrow: Our philosophy
        heading: Discover your *inner artist*
        body: "Reshu Art Lobby was founded on a simple belief: creativity knows no age.
          From curious four-year-olds to seasoned adults, every student is
          guided at their own pace by experienced, encouraging teachers."
        list:
          - title: Every level welcome.
            text: Beginner, intermediate and advanced tracks across more than a dozen art
              forms.
          - title: Flexible by design.
            text: Weekday, evening and weekend classes — join a session at any point.
          - title: Try before you commit.
            text: A free trial class helps teachers place your child in the right batch.
        button_label: Read the bio
        button_link: bio
        button_style: link
  - layout: cards
    tint: tint
    eyebrow: Learn with us
    heading: Classes for *every age*
    intro: Structured twelve-week sessions, one hour a week, in our Chantilly and
      Ashburn studios.
    cards:
      - kicker: Ages 4 – 18
        title: Kids & Youth Classes
        text: Twelve-week sessions in any art form, with a gentle path from beginner to
          advanced.
        link: classes
        art: watercolor
        art_seed: 5
      - kicker: Adults
        title: Adult Classes & Nights
        text: Unhurried weekly classes, palette-knife acrylics and relaxed ladies’ paint
