      - eyebrow: Why paint together
        heading: Creativity that *connects*
        body: A paint event gives a team something shared to do outside the usual routine. Everyone follows the same guided steps, yet every canvas turns out differently — a natural conversation starter that levels the room.
        list:
          - title: Everyone can join.
            text: Our instructors guide each step, so first-timers feel as confident as seasoned painters.
          - title: Hands-on bonding.
            text: Relaxed, screen-free time that builds rapport across departments.
          - title: A keepsake.
            text: Every person takes home a finished painting.
      - eyebrow: Perfect for
        heading: Every *occasion*
        list:
          - text: Team-building days and offsites
          - text: Onboarding and welcome events
          - text: Holiday and appreciation parties
          - text: Client and partner experiences
          - text: Remote and hybrid team sessions
        body: Tell us your date, group size and goals, and we will tailor the session and send a quote. Email [reshuartlobby@gmail.com](mailto:reshuartlobby@gmail.com) or call (571) 325-7622.
