          A dreamy moonlit forest comes alive with vibrant red blossoms and a winding path glowing under the night sky. Deep blues, soft moonlight and delicate trees create a serene world of quiet wonder — perfect for blending colours.

          Whether you are an experienced artist or a complete beginner, an instructor walks you from colour choices to brushwork. All you bring is enthusiasm.
